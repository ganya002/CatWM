name = "ouch-report-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# The Linear team reports go to: OUC. Linear's API wants its UUID, not the prefix
# (Linear → the team's settings → ⌘K → "Copy model UUID").
LINEAR_TEAM_ID = "0f09b661-fafb-4a98-9b48-ba50b258a118"
# The "perf-auto" label, put on issues the performance monitor files by itself.
LINEAR_PERF_LABEL_ID = "80f409e0-f882-4573-ac76-5c94b035341c"

# Five reports a minute per IP is plenty for real users.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
