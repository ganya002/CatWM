<!-- @dsCard group="Controls" height=280 subtitle="Open list: no box, hairlines between rows" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Row — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
mount(h('div', { style: { maxWidth: 560 } }, h(O.Group, { title: 'Behavior', footer: 'Applies to new windows only.' },
  h(O.Row, { symbol: 'cursorarrow', label: 'Focus follows mouse', description: 'Hovering a window focuses it' }, h(O.Switch, { label: 'Focus follows mouse' })),
  h(O.Row, { symbol: 'macwindow.on.rectangle', label: 'New windows go to main', description: 'Instead of the end of the stack' }, h(O.Switch, { defaultChecked: true, label: 'New windows to main' })),
  h(O.Row, { symbol: 'wand.and.stars', label: 'Animation curve' }, h(O.Segmented, { options: ['Ease', 'Spring', 'Off'], defaultValue: 'Spring' })),
  h(O.Row, { symbol: 'keyboard', label: 'Enter window mode' }, h(O.Kbd, { keys: ['cmd', 'caps'] })))));
</script>
</body>
</html>
