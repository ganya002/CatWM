<!-- @dsCard group="Surfaces" height=470 width=420 subtitle="Hover, arrows, or just type" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Menu — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
var items = [
  { type: 'search', placeholder: 'Search commands…', shortcut: ['cmd', 'K'] },
  { type: 'label', label: 'Workspace 1 · Fullscreen' },
  { type: 'custom', render: function () { return h(O.WorkspaceStrip, { current: 1 }); } },
  { type: 'sep' },
  { type: 'sub', label: 'Layout', value: 'Fullscreen', symbol: 'square.grid.2x2', width: 260, items: [
    { type: 'custom', render: function () { return h(O.LayoutPicker, { columns: 4, thumb: 44, defaultValue: 'fullscreen' }); } }
  ] },
  { type: 'sep' },
  { id: 'settings', label: 'Settings…', symbol: 'gearshape', shortcut: ['cmd', ','] },
  { id: 'tour', label: 'Keyboard Tutorial…', symbol: 'graduationcap' },
  { type: 'sub', label: 'Help', symbol: 'questionmark.circle', items: [
    { id: 'map', label: 'Shortcut Map', symbol: 'keyboard', shortcut: ['cmd', '/'] }
  ] },
  { type: 'sep' },
  { type: 'footer', render: function () {
    return h(React.Fragment, null,
      h('span', null, 'Ouch 0.2-beta'),
      h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 8 } }, h(O.Symbol, { name: 'power', size: 14 }), 'Quit Ouch'),
      h(O.Kbd, { keys: ['cmd', 'Q'] }));
  } }
];
mount(h(O.Menu, { items: items, glass: true }));
</script>
</body>
</html>
