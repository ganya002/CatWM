<!-- @dsCard group="Primitives" height=240 subtitle="SF Symbols, driven by effect. Click to replay." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Symbol — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
var fx = [
  ['bounce', 'arrow.down.circle', '.bounce', 'Action landed'],
  ['wiggle', 'exclamationmark.triangle', '.wiggle', 'Something refused'],
  ['rotate', 'arrow.triangle.2.circlepath', '.rotate', 'Retile, reload'],
  ['variable', 'rectangle.split.3x1', '.variableColor', 'Windows tiling'],
  ['pulse', 'cursorarrow.rays', '.pulse', 'Waiting for a key'],
  ['breathe', 'lightbulb', '.breathe', 'Tip available'],
  ['replace', 'checkmark.circle.fill', '.replace', 'State flips'],
  ['draw', 'checkmark', '.drawOn', 'Checkmarks'],
  ['appear', 'sparkles', '.appear', 'Something new']
];
function Cell(p) {
  var s = React.useState(0);
  var loop = /pulse|breathe|variable/.test(p.f[0]);
  var name = p.f[0] === 'replace' ? (s[0] % 2 ? 'xmark' : 'checkmark.circle.fill') : p.f[1];
  return h('button', { className: 'o-btn o-btn--ghost', onClick: function () { s[1](s[0] + 1); },
      style: { height: 'auto', padding: '10px 12px', justifyContent: 'flex-start', gap: 14, borderRadius: 14, color: 'var(--ink)' } },
    h('span', { style: { color: 'var(--accent-ink)', display: 'inline-flex' } }, h(O.Symbol, { name: name, effect: loop || s[0] ? p.f[0] : null, trigger: s[0], size: 26 })),
    h('span', { style: { display: 'grid', textAlign: 'left' } },
      h('span', { style: { font: '500 12px/16px var(--font-mono)' } }, p.f[2]),
      h('span', { className: 'o-caption', style: { fontWeight: 400 } }, p.f[3])));
}
mount(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, max-content)', gap: '4px 24px' } }, fx.map(function (f) { return h(Cell, { key: f[0], f: f }); })));
</script>
</body>
</html>
