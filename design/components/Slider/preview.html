<!-- @dsCard group="Controls" height=300 width=760 subtitle="Drag, hold Option for fine control, double-click to reset" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Slider — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
function px(v) { return v + ' px'; }
mount(h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '28px 48px', alignItems: 'start', paddingTop: 18 } },
  h('div', { style: { display: 'grid', gap: 26 } },
    h(O.Slider, { label: 'Window gap', min: 0, max: 40, defaultValue: 12, ticks: 8, format: px }),
    h(O.Slider, { label: 'Split ratio', min: 20, max: 80, defaultValue: 50, ticks: [50], format: function (v) { return v + ' / ' + (100 - v); } }),
    h(O.Slider, { label: 'Duration', min: 0.1, max: 1, step: 0.05, defaultValue: 0.25, format: function (v) { return v.toFixed(2) + ' s'; } })),
  h('div', { style: { display: 'grid', gap: 12 } },
    h(O.Slider, { variant: 'bar', label: 'Gap', symbol: 'square.dashed', min: 0, max: 40, defaultValue: 12, format: px }),
    h(O.Slider, { variant: 'bar', label: 'Speed', symbol: 'wand.and.stars', symbolEffect: 'wiggle', min: 0, max: 100, defaultValue: 64, ticks: [50], format: function (v) { return v + '%'; } }),
    h(O.Slider, { variant: 'bar', label: 'Bounce', symbol: 'sparkles', min: 0, max: 1, step: 0.05, defaultValue: 0.3, format: function (v) { return v.toFixed(2); } }))));
</script>
</body>
</html>
