<!doctype html>

<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }

function Upd() { var s = React.useState(0); return h(O.Button, { variant: 'secondary', icon: 'arrow.down.circle', iconEffect: s[0] ? 'bounce' : null, iconTrigger: s[0], onClick: function () { s[1](s[0] + 1); } }, 'Check for Updates'); }
