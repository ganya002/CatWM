<!doctype html>
<html>
<head><meta charset="utf-8"><title>HUD — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
var order = ['tall', 'wide', 'bsp', 'three-column-middle'];
function Cyc() { var s = React.useState(0); return h('div', { onClick: function () { s[1](s[0] + 1); } }, h(O.HUD, { layout: order[s[0] % order.length], pop: s[0], keys: ['N'], hint: 'Next' })); }
function Warn() { var s = React.useState(0); return h('div', { onClick: function () { s[1](s[0] + 1); } }, h(O.HUD, { warning: true, label: 'Safari won’t go below 520 pt', pop: s[0] })); }
mount(h('div', { style: { display: 'flex', gap: 32, alignItems: 'center', flexWrap: 'wrap' } }, h(Cyc), h(Warn)));
</script>
</body>
</html>
