<!doctype html>
<html>
<head><meta charset="utf-8"><title>Surface — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
function D(p) { return h('div', { style: { display: 'grid', gap: 12, alignContent: 'start', justifyItems: 'start' } }, h(Eyebrow, { n: p.d, t: p.use }), p.children); }
mount(h('div', { style: { display: 'grid', gap: 40 } },
  h('div', { style: { display: 'flex', gap: 48, alignItems: 'flex-start', flexWrap: 'wrap' } },
    h(D, { d: 'xs', use: 'Tooltip' }, h(O.Tooltip, { label: 'Retile', keys: ['Z'] })),
    h(D, { d: 'sm', use: 'Toast, HUD' }, h(O.Surface, { density: 'sm', glass: true, lead: 'checkmark.circle.fill', title: 'Config reloaded', body: '3 binds changed' })),
    h(D, { d: 'md', use: 'Menu, tip' }, h(O.Surface, { density: 'md', style: { padding: 14, width: 250 }, lead: 'lightbulb', leadEffect: 'breathe', kicker: 'Tip', onClose: function () {}, body: 'Hold ⌥ and drag anywhere in a window to move it.' }))),
  h('div', { style: { display: 'flex', gap: 48, alignItems: 'flex-start' } },
    h(D, { d: 'lg', use: 'Tour card' }, h(O.CoachMark, { caret: 'top', caretAt: 40, step: 2, total: 6, title: 'Move focus', body: 'Use H J K L to jump between windows.', keys: ['H'] })),
    h(D, { d: 'xl', use: 'Welcome' }, h(O.Surface, { density: 'xl', lead: 'rectangle.split.3x1', leadEffect: 'variable', kicker: 'Welcome', title: 'Tile without thinking', body: 'Ouch arranges your windows as you open them.', actions: h(O.Button, { variant: 'primary', size: 'lg' }, 'Continue') })))));
</script>
</body>
</html>
