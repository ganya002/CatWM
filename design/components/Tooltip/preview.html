<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip — preview</title>
<style>html,body{margin:0;background:var(--bg)} #root{padding:24px;min-height:100vh;box-sizing:border-box}</style></head>
<body>
<div id="root" class="o-root o-ground"></div>
<script>
var O = window.Ouch, h = React.createElement, F = React.Fragment;
function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Eyebrow(p) { return h('div', { className: 'o-eyebrow' }, h('span', { className: 'o-eyebrow__n' }, p.n), h('span', { className: 'o-eyebrow__t' }, p.t)); }
mount(h('div', { style: { display: 'flex', gap: 56, alignItems: 'flex-start', paddingBottom: 48 } },
  h(O.Tooltip, { label: 'Retile', keys: ['Z'], open: true }, h(O.Button, { variant: 'secondary', icon: 'arrow.triangle.2.circlepath', label: 'Retile' })),
  h(O.Tooltip, { label: 'Next layout', keys: ['N'], open: true }, h(O.Button, { variant: 'secondary', icon: 'square.grid.2x2', label: 'Layout' })),
  h(O.Tooltip, { label: 'Settings', keys: ['cmd', ','], open: true }, h(O.Button, { variant: 'secondary', icon: 'gearshape', label: 'Settings' })),
  h(O.Tooltip, { label: 'Swap with main', open: true }, h(O.Button, { variant: 'secondary', icon: 'arrow.left.arrow.right', label: 'Swap' }))));
</script>
</body>
</html>
