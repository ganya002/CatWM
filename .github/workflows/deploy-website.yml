name: deploy-website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      # Vite+ sets up Node, the package manager from devEngines, the cache and
      # runs vp install. Pin an exact release: the v1 tag is frozen.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: website
          node-version: "22"
          cache: true
          run-install: |
            - cwd: website
              args: ["--frozen-lockfile"]
      # typecheck runs react-router typegen first, and vp check needs those types.
      - run: vp run typecheck
      - run: vp check
      - run: vp exec void deploy --platform cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 865dded96630ca6a533584a80efad356
