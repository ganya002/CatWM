[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catwm-client"
version = "0.1.0"
description = "Control the CatWM tiling window manager"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["catwm"]

[tool.setuptools.package-data]
catwm = ["py.typed"]
